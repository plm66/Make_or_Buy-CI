name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Invariants
    runs-on: [self-hosted, ARM64, make-or-buy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run all invariants
        run: |
          cd Make_or_Buy
          for t in tests/test_*.py; do
            echo "Running $t..."
            python3 -B "$t" || exit 1
          done
